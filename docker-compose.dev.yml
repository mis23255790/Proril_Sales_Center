# 142（dev-mssql-2022-network 主機）的 dev 環境部署，由 self-hosted runner 執行：
#   docker compose -f docker-compose.dev.yml up -d --build
#
# 起之前確認 dev-mssql-2022-network、nginx-proxy 這兩個 external network 已經存在於這台主機
# （docker network ls 查得到），這兩個是別的 compose/手動建的，這份不負責建立它們。
#
# 跟本機單機測試用的 docker-compose.yml（沒有這兩個 network）是分開的兩份檔案，
# 142 上還有另一份 docker-compose.prod.yml 是同一台主機上的 prod 環境，
# name 故意跟這份不同，兩者才能在同一台主機上同時起，不會互相蓋掉。
name: proril_sales_center_dev
services:
  app:
    image: proril-sales-center-app-dev.proril
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-50061}:3000"
    environment:
      PORT: "3000"
    env_file:
      - docker.env
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - dev-mssql-2022-network
      - nginx-proxy

  api:
    image: proril-sales-center-api-dev.proril
    build:
      context: ./api
      dockerfile: Dockerfile
    user: "root"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - api/docker.env
    volumes:
      - D:/proril-sales-center.proril/proril-sales-center-dev.proril/ProrilWebFiles:/app/ProrilWebFiles
      - D:/proril-sales-center.proril/proril-sales-center-dev.proril/Logs:/app/Logs
    restart: unless-stopped
    networks:
      - dev-mssql-2022-network
      - nginx-proxy

networks:
  dev-mssql-2022-network:
    external: true
  nginx-proxy:
    external: true
