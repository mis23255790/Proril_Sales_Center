# 142（dev-mssql-2022-network 主機）的 dev 環境部署，由 self-hosted runner 執行：
#   docker compose -f docker-compose.dev.yml up -d --build
#
# 起之前確認 dev-mssql-2022-network、nginx-proxy 這兩個 external network 已經存在於這台主機
# （docker network ls 查得到），這兩個是別的 compose/手動建的，這份不負責建立它們。
#
# 跟本機單機測試用的 docker-compose.yml（沒有這兩個 network）是分開的兩份檔案，
# 142 上還有另一份 docker-compose.prod.yml 是同一台主機上的 prod 環境，
# name 故意跟這份不同，兩者才能在同一台主機上同時起，不會互相蓋掉。
#
# env_file 指到 runner 容器裡的 /secrets/dev/（api 讀 web-server.env、app 讀 docker.env，
# 前端容器拿不到資料庫密碼）。/secrets/dev 是 runner 自己的 compose
# （D:\github-runners\proril-sales-center.yml）把 142 的
# D:\proril-sales-center.proril\proril-sales-center-dev.proril 整個資料夾唯讀掛進去的，
# 改 env 檔 runner 馬上看得到（單一檔案掛載會有編輯器換檔後看不到新內容的問題）。
# 不用另外複製一份到 checkout 目錄——docker compose 是在 runner 容器裡執行的，
# 讀 env_file 就是讀它自己容器內的檔案系統。
# 改了 env 檔之後要重跑 deploy-dev 讓容器重建，env_file 只在建立容器時讀一次。
#
# ProrilWebFiles 要跟 1.0 共用同一個 host 目錄，不能用 Docker 自己管的匿名 volume；
# 又因為 docker compose 是在 Linux 的 runner 容器裡執行、Windows 路徑字串在這裡解析
# 不出來（絕對路徑判斷是照 Linux 規則），所以改成引用一個「已經綁定到指定 host 路徑」的
# named volume（external: true，要先在 142 上用原生 Windows CLI 建好，見 docker-compose.dev.yml
# 同層目錄的說明或問 CI 設定的人）：
#   docker volume create --driver local --opt type=none --opt o=bind \
#     --opt device="D:\proril-sales-center.proril\proril-sales-center-dev.proril\ProrilWebFiles" \
#     proril-sales-center-dev-prorilwebfiles
#
# container_name 固定死：142 的 nginx_proxy（/etc/nginx/conf.d/proril-sales-center-dev.conf）是用
# 容器名稱 proxy_pass http://proril_sales_center_dev_app:3000 轉發，交給 compose 自動命名
# （proril_sales_center_dev-app-1）的話 CI 建出來的新容器永遠接不到 nginx，畫面一直是舊的。
# 第一次切過來前要先刪掉手動建的同名舊容器，否則名稱衝突起不來：
#   docker rm -f proril_sales_center_dev_app proril_sales_center_dev_api
name: proril_sales_center_dev
services:
  app:
    container_name: proril_sales_center_dev_app
    image: proril-sales-center-app-dev.proril
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-50061}:3000"
    environment:
      PORT: "3000"
      # server/api/proxy 轉發的後端。沒設的話 nuxt.config.ts 會退回 https://intranet-dev.proril.com（1.0），
      # 新端點全部 404。用容器名稱不用服務名 api：nginx-proxy 是多個專案共用的網路，api 可能撞名。
      NUXT_PUBLIC_API_BASE: http://proril_sales_center_dev_api:8080
    env_file:
      - /secrets/dev/docker.env
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - dev-mssql-2022-network
      - nginx-proxy

  api:
    container_name: proril_sales_center_dev_api
    image: proril-sales-center-api-dev.proril
    build:
      context: ./api
      dockerfile: Dockerfile
    user: "root"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - /secrets/dev/web-server.env
    volumes:
      - proril-sales-center-dev-prorilwebfiles:/app/ProrilWebFiles
      - proril-sales-center-dev-logs:/app/Logs
    restart: unless-stopped
    networks:
      - dev-mssql-2022-network
      - nginx-proxy

networks:
  dev-mssql-2022-network:
    external: true
  nginx-proxy:
    external: true

volumes:
  proril-sales-center-dev-prorilwebfiles:
    external: true
  proril-sales-center-dev-logs:
    name: proril-sales-center-dev-logs
