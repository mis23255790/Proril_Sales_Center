name: deploy-dev

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, docker, proril-sales-center]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Inject env files
        run: |
          cp /secrets/proril-sales-center.env.dev docker.env
          cp /secrets/proril-sales-center.env.dev api/docker.env

      - name: Deploy
        run: |
          export APP_PORT=50061
          docker compose -f docker-compose.dev.yml up -d --build
