name: ci

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore api/Proril.SalesIssue.Api.csproj

      - name: Build
        run: dotnet build api/Proril.SalesIssue.Api.csproj -c Release --no-restore

  deploy-dev:
    needs: [frontend, api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject env files
        shell: pwsh
        run: |
          Copy-Item "C:\actions-runner\secrets\docker.env" "docker.env" -Force
          Copy-Item "C:\actions-runner\secrets\api.docker.env" "api\docker.env" -Force

      - name: Deploy
        shell: pwsh
        run: docker compose up -d --build
