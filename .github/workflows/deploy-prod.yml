name: deploy-prod

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, docker, proril-sales-center]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Inject env files
        run: |
          cp /secrets/proril-sales-center.env.production docker.env
          cp /secrets/proril-sales-center.env.production api/docker.env

      - name: Deploy
        run: |
          export APP_PORT=51061
          docker compose -f docker-compose.prod.yml up -d --build
